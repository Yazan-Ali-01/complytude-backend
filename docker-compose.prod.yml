# ============================================
# Production Docker Compose Configuration
# ============================================
# This file extends docker-compose.yml for production
#
# Features:
#   - Optimized production build
#   - No volume mounts (immutable container)
#   - Runs compiled code
#   - Non-root user for security
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#   Or: pnpm docker:prod
# ============================================

services:
  # Complytude API - Production Mode
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: complytude-api:latest
    container_name: complytude-api-prod
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      # Override for production
      NODE_ENV: production
      # Override for Docker networking
      DB_HOST: postgres
      DB_PORT: 5432
      S3_ENDPOINT: http://minio:9000
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - complytude-network

networks:
  complytude-network:
    driver: bridge
