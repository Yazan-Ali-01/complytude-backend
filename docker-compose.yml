name: complytude

# ============================================
# Base Docker Compose Configuration
# ============================================
# This file contains shared services (PostgreSQL, Redis, Gotenberg, pgAdmin)
# S3 storage uses real AWS S3 — configure via .env files.
#
# Usage:
#   Development: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Or use the npm scripts:
#   pnpm docker:dev
#   pnpm docker:prod
# ============================================

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: complytude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-complytude}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init-pgvector.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complytude-network

  # pgAdmin - Database Management Tool (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: complytude-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@complytude.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - complytude-network
    profiles:
      - tools

  # Redis - Message Queue for BullMQ
  redis:
    image: redis:7-alpine
    container_name: complytude-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complytude-network

  # Gotenberg - DOCX to PDF conversion
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: complytude-gotenberg
    restart: unless-stopped
    ports:
      - '${GOTENBERG_PORT:-3100}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - complytude-network

  # Worker Generation - Document generation worker
  worker-generation:
    build:
      context: .
      dockerfile: apps/worker-generation/Dockerfile
    image: complytude-worker-generation:latest
    container_name: complytude-worker-generation
    restart: unless-stopped
    env_file:
      - apps/worker-generation/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - complytude-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  complytude-network:
    driver: bridge
