name: complytude

# ============================================
# Base Docker Compose Configuration
# ============================================
# This file contains shared infrastructure services (PostgreSQL, Redis, pgAdmin)
#
# Usage:
#   pnpm services:up    - Start all infrastructure services
#   pnpm services:down  - Stop all services
#   pnpm services:reset - Wipe volumes and re-migrate
# ============================================

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: complytude-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-complytude}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sh:/docker-entrypoint-initdb.d/init-pgvector.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complytude-network

  # pgAdmin - Database Management Tool (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: complytude-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@complytude.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - complytude-network
    profiles:
      - tools

  # Redis - Message Queue for BullMQ
  redis:
    image: redis:7-alpine
    container_name: complytude-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complytude-network


  # Gotenberg - DOCX to PDF conversion
  gotenberg:
    # Same pin as the worker-generation sidecar on ECS (infra/modules/ecs, gotenberg_image)
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    container_name: complytude-gotenberg
    restart: unless-stopped
    ports:
      - '${GOTENBERG_PORT:-3100}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - complytude-network

  # Worker Generation - Document generation worker
  worker-generation:
    build:
      context: .
      dockerfile: apps/worker-generation/Dockerfile
    image: complytude-worker-generation:latest
    container_name: complytude-worker-generation
    restart: unless-stopped
    env_file:
      - apps/worker-generation/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - complytude-network
    profiles:
      - workers


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
networks:
  complytude-network:
    driver: bridge
