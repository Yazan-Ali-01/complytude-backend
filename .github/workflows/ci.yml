name: CI

# Runs on every pull request, and as the gate of the staging deploy (deploy-staging.yml calls it).
# Make every job (the four images included) a required status check in the branch protection of
# development and main.
on:
  pull_request:
    branches: [development, main]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on any high or critical advisory in production dependencies (the lockfile, not
      # node_modules, is audited, so no install is needed)
      - run: pnpm audit --prod --audit-level=high

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: complytude
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_APP_USER: app_login
      DB_APP_PASSWORD: ci-only-app-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Applied migrations are never edited: only new files may be added
      - name: Migrations are append-only
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare against; skipping"
          else
            bash scripts/check-migrations-append-only.sh "$BASE"
          fi
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get install -y postgresql-client
      # From zero, then again (nothing to apply), then verify the recorded checksums
      - name: Migrate a fresh database
        run: |
          bash scripts/setup-roles.sh
          bash scripts/run-migrations.sh
          bash scripts/run-migrations.sh
          bash scripts/run-migrations.sh --check

  checks:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No --fix: CI must fail on lint errors and warnings, not rewrite them
      - run: pnpm lint:ci
      - run: pnpm type-check
      - run: pnpm test:unit --ci

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts Postgres (pgvector) and Redis on the runner's Docker
      - run: pnpm test:integration --ci

  images:
    name: Production image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker-ai, worker-ingestion, worker-generation]
    steps:
      - uses: actions/checkout@v4
      # pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # ts-node and psql apply the roles and migrations the smoke test boots against
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get install -y postgresql-client
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          load: true
          tags: complytude/${{ matrix.app }}:ci
          # One cache per app (shared with the deploy build of the same app)
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Every package the app requires loads from the image's own dependencies, and the image boots
      # as ECS runs it (production env, TLS to Postgres) until its health endpoint answers
      - name: Smoke test the image
        run: bash scripts/ci/smoke-image.sh ${{ matrix.app }} complytude/${{ matrix.app }}:ci
