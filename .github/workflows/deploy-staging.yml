name: Deploy to Staging

on:
  push:
    branches: [development]

# A newer push waits for the running deploy instead of cancelling it halfway (the rollback workflow
# shares this group)
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Nothing but read access by default; the AWS jobs add id-token (OIDC) below
permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: complytude-staging

jobs:
  # Same gate as pull requests (lint, type-check, unit and integration tests); every deploy step
  # below depends on it through `migrate`.
  quality:
    uses: ./.github/workflows/ci.yml

  migrate:
    runs-on: ubuntu-latest
    needs: quality
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials for the deploy role (OIDC, infra/modules/github-oidc); only jobs in
      # the staging environment can assume it
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # psql for the role setup; the Session Manager plugin for port forwarding through the bastion
      - name: Install PostgreSQL client and Session Manager plugin
        run: |
          sudo apt-get install -y postgresql-client
          curl -fsSLo /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      # The migration runner is TypeScript (scripts/migrate.ts)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The master password is RDS's own secret, the app login's is complytude/staging/db-app:
      # neither is a repository secret, nor in Terraform state
      - name: Fetch infrastructure details
        id: infra
        run: |
          DB=$(aws rds describe-db-instances \
            --db-instance-identifier complytude-staging-postgres \
            --query 'DBInstances[0].[Endpoint.Address, MasterUserSecret.SecretArn]' \
            --output text)
          DB_HOST=$(echo "$DB" | cut -f1)
          MASTER_SECRET_ARN=$(echo "$DB" | cut -f2)
          DB_ADMIN_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$MASTER_SECRET_ARN" \
            --query SecretString --output text | jq -r .password)
          DB_APP_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id complytude/staging/db-app \
            --query SecretString --output text | jq -r .DB_APP_PASSWORD)
          echo "::add-mask::$DB_ADMIN_PASSWORD"
          echo "::add-mask::$DB_APP_PASSWORD"

          BASTION_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=complytude-staging-bastion" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          echo "bastion_id=$BASTION_ID" >> $GITHUB_OUTPUT
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_admin_password=$DB_ADMIN_PASSWORD" >> $GITHUB_OUTPUT
          echo "db_app_password=$DB_APP_PASSWORD" >> $GITHUB_OUTPUT

      # Session Manager port forwarding: IAM-authorised and logged, no SSH key, no inbound rule,
      # no security-group edits (the bastion→RDS rule is Terraform's)
      - name: Forward a local port to RDS through the bastion
        run: |
          aws ssm start-session \
            --target ${{ steps.infra.outputs.bastion_id }} \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "host=${{ steps.infra.outputs.db_host }},portNumber=5432,localPortNumber=15432" \
            >/tmp/ssm-session.log 2>&1 &
          echo $! >/tmp/ssm-session.pid
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 15432 -q && exit 0
            sleep 1
          done
          cat /tmp/ssm-session.log
          exit 1

      # Idempotent: creates missing roles; an existing app_login keeps its password
      - name: Setup database roles
        env:
          DB_HOST: localhost
          DB_PORT: '15432'
          DB_NAME: complytude
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.infra.outputs.db_admin_password }}
          DB_APP_USER: app_login
          DB_APP_PASSWORD: ${{ steps.infra.outputs.db_app_password }}
        run: bash scripts/setup-roles.sh

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: '15432'
          DB_NAME: complytude
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.infra.outputs.db_admin_password }}
        run: bash scripts/run-migrations.sh

      - name: Close the port forwarding
        if: always()
        run: |
          [ -f /tmp/ssm-session.pid ] && kill "$(cat /tmp/ssm-session.pid)" || true

  # After migrations: no image of this commit exists unless its schema is in place
  build-and-push:
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        app: [api, worker-ai, worker-ingestion, worker-generation]
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials for the deploy role (OIDC, infra/modules/github-oidc); only jobs in
      # the staging environment can assume it
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          # The git SHA only: tags are immutable in ECR, and deploys pin the digest
          tags: ${{ steps.ecr.outputs.registry }}/complytude/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gate on the image scan
        run: bash scripts/deploy/ecr-scan-gate.sh complytude/${{ matrix.app }} ${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials for the deploy role (OIDC, infra/modules/github-oidc); only jobs in
      # the staging environment can assume it
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # New task-definition revisions pinned to this commit's image digests; fails (red) when the
      # circuit breaker rolls a service back, then smoke-tests the API
      - name: Deploy ${{ github.sha }}
        run: bash scripts/deploy/ecs-deploy.sh --env staging --sha ${{ github.sha }} --smoke "${{ vars.STAGING_API_URL }}"
