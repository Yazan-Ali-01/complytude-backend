name: Deploy to Staging

on:
  push:
    branches: [development]

# A newer push waits for the running deploy instead of cancelling it halfway (the rollback workflow
# shares this group)
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  ECS_CLUSTER: complytude-staging

jobs:
  # Same gate as pull requests (lint, type-check, unit and integration tests); every deploy step
  # below depends on it through `migrate`.
  quality:
    uses: ./.github/workflows/ci.yml

  migrate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Fetch infrastructure details
        id: infra
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id complytude/staging/app \
            --query SecretString \
            --output text)

          BASTION_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=complytude-staging-bastion" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          BASTION_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=complytude-staging-bastion-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          RDS_SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=complytude-staging-rds-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text)

          DB_HOST=$(echo "$SECRET" | jq -r .DB_HOST)
          DB_APP_USER=$(echo "$SECRET" | jq -r .DB_APP_USER)
          DB_APP_PASSWORD=$(echo "$SECRET" | jq -r .DB_APP_PASSWORD)

          echo "::add-mask::$DB_APP_PASSWORD"

          echo "bastion_ip=$BASTION_IP" >> $GITHUB_OUTPUT
          echo "bastion_sg_id=$BASTION_SG_ID" >> $GITHUB_OUTPUT
          echo "rds_sg_id=$RDS_SG_ID" >> $GITHUB_OUTPUT
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_app_user=$DB_APP_USER" >> $GITHUB_OUTPUT
          echo "db_app_password=$DB_APP_PASSWORD" >> $GITHUB_OUTPUT

      - name: Get runner public IP
        id: runner-ip
        run: echo "ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Allow runner SSH access to bastion
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.infra.outputs.bastion_sg_id }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32 || true

      - name: Allow bastion access to RDS
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ steps.infra.outputs.rds_sg_id }} \
            --protocol tcp \
            --port 5432 \
            --source-group ${{ steps.infra.outputs.bastion_sg_id }} || true

      - name: Open SSH tunnel to RDS
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > /tmp/bastion_key
          chmod 600 /tmp/bastion_key

          ssh -i /tmp/bastion_key \
            -fNL 15432:${{ steps.infra.outputs.db_host }}:5432 \
            ec2-user@${{ steps.infra.outputs.bastion_ip }} \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30

          sleep 2

      - name: Setup database roles
        env:
          DB_HOST: localhost
          DB_PORT: '15432'
          DB_NAME: complytude
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          DB_APP_USER: ${{ steps.infra.outputs.db_app_user }}
          DB_APP_PASSWORD: ${{ steps.infra.outputs.db_app_password }}
        run: bash scripts/setup-roles.sh

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: '15432'
          DB_NAME: complytude
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
        run: bash scripts/run-migrations.sh

      - name: Cleanup
        if: always()
        run: |
          pkill -f "ssh.*15432" || true
          rm -f /tmp/bastion_key

          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.infra.outputs.bastion_sg_id }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32 || true

          aws ec2 revoke-security-group-ingress \
            --group-id ${{ steps.infra.outputs.rds_sg_id }} \
            --protocol tcp \
            --port 5432 \
            --source-group ${{ steps.infra.outputs.bastion_sg_id }} || true

  # After migrations: no image of this commit exists unless its schema is in place
  build-and-push:
    runs-on: ubuntu-latest
    needs: migrate
    strategy:
      matrix:
        app: [api, worker-ai, worker-ingestion, worker-generation]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          # The git SHA only: tags are immutable in ECR, and deploys pin the digest
          tags: ${{ env.ECR_REGISTRY }}/complytude/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gate on the image scan
        run: bash scripts/deploy/ecr-scan-gate.sh complytude/${{ matrix.app }} ${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # New task-definition revisions pinned to this commit's image digests; fails (red) when the
      # circuit breaker rolls a service back, then smoke-tests the API
      - name: Deploy ${{ github.sha }}
        run: bash scripts/deploy/ecs-deploy.sh --env staging --sha ${{ github.sha }} --smoke "${{ vars.STAGING_API_URL }}"
