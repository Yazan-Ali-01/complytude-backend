name: Roll back staging

# Redeploys every staging service to the images of an earlier commit (already built and in ECR).
# Migrations are forward-only and are not run: the older code runs against the current schema.
#
#   gh workflow run rollback-staging.yml -f sha=<git-sha>
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full git SHA of the commit to redeploy
        required: true
        type: string

# Shared with the deploy workflow: a rollback never runs at the same time as a deploy
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy ${{ inputs.sha }}
        run: bash scripts/deploy/ecs-deploy.sh --env staging --sha "${{ inputs.sha }}" --smoke "${{ vars.STAGING_API_URL }}"
